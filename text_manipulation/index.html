<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Text Manipulation</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="container">

        <h1 id="title">Text Manipulation with JavaScript</h1>
        <p id="content">
        This paragraph will change when you click the buttons below.
        </p>

        <div class="buttons">
            <button id="plainText">Change with textContent</button>
            <button id="htmlText">Change with innerHTML</button>
            <button id="increaseSize">Increase Text Size</button>
            <button id="reset">Reset</button>
        </div>

    </div>
    
    <script src="script.js"></script>
</body>
</html>
