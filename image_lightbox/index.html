<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Image Lightbox</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="container">

        <h1>Image Gallery</h1>

        <div class="gallery" id="gallery">

            <img src="https://picsum.photos/200?1" alt="img1">
            <img src="https://picsum.photos/200?2" alt="img2">
            <img src="https://picsum.photos/200?3" alt="img3">
            <img src="https://picsum.photos/200?4" alt="img4">

        </div>

    </div>

    <!-- Lightbox -->
    <div id="lightbox" class="lightbox">
        <img id="lightboxImg">
    </div>

    <script src="script.js"></script>
</body>
</html>
