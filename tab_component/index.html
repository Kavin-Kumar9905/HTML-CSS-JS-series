<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tabs Component</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="container">

        <h1>Tabs Component</h1>

        <div class="tabs">

            <div class="tab-buttons">
                <button class="tab-btn active" data-tab="1">Tab 1</button>
                <button class="tab-btn" data-tab="2">Tab 2</button>
                <button class="tab-btn" data-tab="3">Tab 3</button>
            </div>

            <div class="tab-content">

                <div class="content active" data-content="1">
                    <p>This is content for Tab 1</p>
                </div>

                <div class="content" data-content="2">
                    <p>This is content for Tab 2</p>
                </div>

                <div class="content" data-content="3">
                    <p>This is content for Tab 3</p>
                </div>

            </div>

        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
