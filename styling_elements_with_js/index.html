<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Styling Elements with JavaScript</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="container">

        <h1 id="title">Styling Elements with JavaScript</h1>
        <p id="text">
            Click the buttons below to apply different color styles using JavaScript.
        </p>

        <div class="buttons">
            <button id="red">Apply Red Theme</button>
            <button id="blue">Apply Blue Theme</button>
            <button id="gradient">Apply Gradient Background</button>
            <button id="reset">Reset Style</button>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
