<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Multi Counter</title>
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>

        <div class="container">

            <h1>Multi Counter</h1>

            <div class="counter">

                <p class="count">0</p>

                <div class="buttons">
                    <button class="increase">+</button>
                    <button class="decrease">−</button>
                </div>

            </div>

            <div class="counter">

                <p class="count">0</p>

                <div class="buttons">
                    <button class="increase">+</button>
                    <button class="decrease">−</button>
                </div>

            </div>

            <div class="counter">

                <p class="count">0</p>

                <div class="buttons">
                    <button class="increase">+</button>
                    <button class="decrease">−</button>
                </div>

            </div>

        </div>

        <script src="script.js"></script>
    </body>
</html>
