<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Counter with Limits</title>
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>

        <div class="container">

            <h1>Counter with Limits</h1>

            <p id="count">0</p>

            <div class="button-group">
                <button id="decrease">−</button>
                <button id="increase">+</button>
            </div>

            <p id="message"></p>

        </div>

        <script src="script.js"></script>
    </body>
</html>
