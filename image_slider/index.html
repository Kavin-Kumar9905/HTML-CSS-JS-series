<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Image Slider</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="container">

    <h1>Image Slider</h1>

        <div class="slider">

        <img id="slide" src="https://picsum.photos/seed/1/600/300" alt="slide">

        <div class="controls">
            <button id="prev">Prev</button>
            <button id="next">Next</button>
        </div>

        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
