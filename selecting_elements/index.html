<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Selecting Elements</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1 class="title">Selecting Elements with querySelector</h1>
        <p class="description">
            Click the buttons below to change how this text looks.
        </p>
    </div>

    <div class="buttons">
        <button id="changeColor">Change Color</button>
        <button id="makeBold">Make Bold</button>
        <button id="uppercase">Uppercase Text</button>
        <button id="reset">Reset</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
